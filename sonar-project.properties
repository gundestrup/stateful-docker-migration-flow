# SonarQube Cloud configuration.
#
# One-time service-side setup (cannot be done from the repo):
#   1. Import gundestrup/stateful-docker-migration-flow at https://sonarcloud.io
#      and confirm the organization/project key below.
#   2. Switch the project from Automatic Analysis to CI-based analysis
#      (Administration -> Analysis Method) — automatic analysis cannot
#      import test coverage.
#   3. Add SONAR_TOKEN to the GitHub repository secrets.
# The CI `sonar` job self-skips while the token is absent.
#
# Imports the kcov sonarqube report produced by the regression suite:
#   coverage-sonar.xml -> sonar.coverageReportPaths (generic coverage format)

sonar.organization=gundestrup
sonar.projectKey=gundestrup_stateful-docker-migration-flow
sonar.projectName=stateful-docker-migration-flow

# Sources are the Bash entry point plus its library; tests hold no
# production code and are excluded from kcov coverage as well.
sonar.sources=lib,sdmf
sonar.exclusions=coverage/**/*,coverage-*.xml

sonar.coverageReportPaths=coverage-sonar.xml
