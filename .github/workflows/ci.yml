name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression-tests:
    name: Docker regression suite
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build test image
        run: docker build -t sdmf-tests -f tests/Dockerfile .

      - name: Run regression tests (with kcov coverage)
        run: |
          mkdir -p coverage
          docker run --rm \
            --cap-add SYS_PTRACE --security-opt seccomp=unconfined \
            -v "$PWD:/workspace:ro" -v "$PWD/coverage:/coverage" \
            sdmf-tests \
            kcov --include-path=/workspace --exclude-path=/workspace/tests \
              /coverage /workspace/tests/run.sh
          cp coverage/*/cobertura.xml coverage-regression.xml
          cp coverage/*/sonarqube.xml coverage-sonar.xml
          # kcov records container paths; make them repo-relative so the
          # Sonar scanner can match them to sonar.sources.
          sed -i 's|/workspace/||g' coverage-sonar.xml

      - name: Upload Sonar coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sonar-coverage
          path: coverage-sonar.xml
          if-no-files-found: error
          retention-days: 5

      - name: Upload coverage to Codecov
        if: hashFiles('coverage-regression.xml') != ''
        uses: codecov/codecov-action@af09b5e394c93991b95a5e7646aeb90c1917f78f # v5.5.1
        with:
          files: ./coverage-regression.xml
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  e2e-tests:
    name: End-to-end migration test (real dockerd)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build e2e image
        run: docker build -t sdmf-e2e-tests -f tests/Dockerfile.e2e .

      - name: Run end-to-end migration test
        run: docker run --rm --privileged -v "$PWD:/workspace:ro" sdmf-e2e-tests

  shell-analysis:
    name: Shell syntax and ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Bash syntax check
        run: bash -n lib/*.sh tests/*.sh sdmf

      - name: ShellCheck
        run: shellcheck -x lib/*.sh tests/*.sh sdmf

  semgrep:
    name: Semgrep security scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Semgrep
        run: pip3 install --only-binary ":all:" "semgrep==1.176.0"

      - name: Run Semgrep (CE, repo-local rules)
        run: semgrep scan --config .semgrep.yml --error --oss-only --metrics off --disable-version-check .

  sonar:
    name: SonarCloud
    needs: regression-tests
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download coverage report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sonar-coverage

      # Self-skips until SONAR_TOKEN is added to the repository secrets.
      - name: SonarCloud scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0

  markdownlint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff
        with:
          config: .markdownlint-cli2.jsonc
          globs: |
            AGENTS.md
            [Cc][Hh][Aa][Nn][Gg][Ee][Ll][Oo][Gg].md
            [Rr][Ee][Aa][Dd][Mm][Ee].md
            README.*.md
